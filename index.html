<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="scoreboard">
        <div class="team">
            <h3 class="team-title">HOME TEAM</h3>
            <h2 id="home-score" class="score">0</h2>
            <div class="score-buttons">
                <button onclick="addOne()">+1</button>
                <button onclick="addTwo()">+2</button>
                <button onclick="addThree()">+3</button>
            </div>

        </div>

        <div class="team">
            <h3 class="team-title">AWAY TEAM</h3>
            <h2 id="guest-score" class="score">0</h2>
            <div class="score-buttons">
                <button onclick="addOneG()">+1</button>
                <button onclick="addTwoG()">+2</button>
                <button onclick="addThreeG()">+3</button>
            </div>

        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
